name: Nightly E2E Matrix

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - domain: packs
            test-type: validate
          - domain: provider-core
            test-type: conformance
          - domain: all
            test-type: component
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tooling
        uses: ./.github/actions/ci-setup

      - name: Ensure wasm32-wasip2 target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip2
          rustup target list --installed | grep -Fx wasm32-wasip2

      - name: Install greentic CLIs
        shell: bash
        run: |
          cargo binstall greentic-component --no-confirm --force

      - name: Prepare artifacts
        shell: bash
        run: |
          ARTIFACTS_DIR="artifacts/${{ matrix.domain }}/${{ matrix.test-type }}"
          mkdir -p "${ARTIFACTS_DIR}"
          echo "ARTIFACTS_DIR=${ARTIFACTS_DIR}" >> "$GITHUB_ENV"

      - name: Pack validation
        if: matrix.test-type == 'validate'
        shell: bash
        run: |
          set -euo pipefail
          cargo run -p greentic-integration --bin greentic-integration -- packs validate | tee "${ARTIFACTS_DIR}/packs_validate.log"

      - name: Provider-core conformance
        if: matrix.test-type == 'conformance'
        shell: bash
        run: |
          set -euo pipefail
          GREENTIC_PROVIDER_CORE_ONLY=1 cargo test -p greentic-integration --test pr14_provider_core_e2e -- --nocapture \
            | tee "${ARTIFACTS_DIR}/provider_core_conformance.log"

      - name: Component contract tests
        if: matrix.test-type == 'component'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p greentic-component --all-features | tee "${ARTIFACTS_DIR}/component_tests.log"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.domain }}-${{ matrix.test-type }}
          path: |
            ${{ env.ARTIFACTS_DIR }}
            target/e2e/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Summary
        if: always()
        shell: bash
        run: |
          pack_count=$(find packs -maxdepth 2 -name "pack.json" 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### Nightly ${{ matrix.domain }} / ${{ matrix.test-type }}"
            echo ""
            echo "- Packs tested: ${pack_count}"
            echo "- Status: ${{ job.status }}"
            echo "- Artifacts: nightly-${{ matrix.domain }}-${{ matrix.test-type }}"
          } >> "$GITHUB_STEP_SUMMARY"

  gtest-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup tooling
        uses: ./.github/actions/ci-setup

      - name: Ensure wasm32-wasip2 target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add wasm32-wasip2
          rustup target list --installed | grep -Fx wasm32-wasip2

      - name: Install greentic CLIs
        shell: bash
        run: |
          cargo binstall greentic-pack --no-confirm --force
          cargo binstall greentic-component --no-confirm --force
          cargo binstall greentic-flow --no-confirm --force
          cargo binstall greentic-runner --no-confirm --force

      - name: Run gtest smoke with triage
        shell: bash
        run: |
          cargo run -p greentic-integration-tester -- \
            --test tests/gtests/00_smoke_validator.gtest \
            --triage-flakes \
            --triage-runs 3
          cargo run -p greentic-integration-tester -- \
            --test tests/gtests/01_capture_and_expect.gtest \
            --triage-flakes \
            --triage-runs 3

      - name: Upload flake artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-flake-artifacts
          path: |
            target/flake-artifacts/**
            target/e2e/**
          if-no-files-found: ignore
          retention-days: 14
